[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-agent-memory"
version = "0.1.0"
description = "A Twilio SMS and Voice demo of conversational agent memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.97.0",
    "openai-agents>=0.22.0",
    "python-dotenv>=1.0.0",
    "twilio>=9.12.0",
    "twilio-agent-connect[server]>=2.4.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0"]

[project.scripts]
conversational-agent-memory = "conversation_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
